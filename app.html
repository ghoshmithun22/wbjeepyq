<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WB JEE PYQ Solver – Practice App</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0a0f1e;--surface:#111827;--card:#1a2235;--border:#243044;--accent:#f59e0b;--accent2:#3b82f6;--green:#10b981;--red:#ef4444;--text:#f1f5f9;--muted:#94a3b8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;background-image:radial-gradient(ellipse at 20% 0%,rgba(59,130,246,.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(245,158,11,.06) 0%,transparent 60%);}
body.lang-bn{font-family:'Noto Sans Bengali','Sora',sans-serif;}
body.lang-hi{font-family:'Noto Sans Devanagari','Sora',sans-serif;}
header{padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;background:rgba(10,15,30,.92);backdrop-filter:blur(10px);flex-wrap:wrap;gap:8px;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.logo-text{font-size:1rem;font-weight:800;font-family:'Sora',sans-serif!important;}.logo-text span{color:var(--accent);}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.lang-switcher{display:flex;align-items:center;gap:3px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:3px;}
.lang-btn{font-family:'Sora',sans-serif!important;padding:5px 11px;border-radius:7px;font-size:.72rem;font-weight:700;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all .2s;white-space:nowrap;}
.lang-btn.active{background:var(--accent);color:#000;}
.lang-btn:hover:not(.active){background:rgba(255,255,255,.07);color:var(--text);}
.badge{background:rgba(245,158,11,.15);color:var(--accent);border:1px solid rgba(245,158,11,.3);padding:4px 10px;border-radius:20px;font-size:.68rem;font-weight:600;font-family:'Sora',sans-serif!important;}
.back-btn{font-family:'Sora',sans-serif;background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;font-size:.75rem;cursor:pointer;transition:all .2s;}
.back-btn:hover{border-color:var(--accent2);color:var(--text);}
.hero{text-align:center;padding:30px 24px 14px;}
.hero h1{font-size:clamp(1.3rem,4vw,2.1rem);font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#f1f5f9,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero h1 .accent{background:linear-gradient(135deg,var(--accent),#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero p{color:var(--muted);margin-top:6px;font-size:.84rem;}
.stats{display:flex;justify-content:center;gap:20px;padding:10px 24px 16px;flex-wrap:wrap;}
.stat{text-align:center;}.stat-num{font-size:1.3rem;font-weight:800;color:var(--accent);font-family:'Sora',sans-serif!important;}.stat-label{font-size:.65rem;color:var(--muted);margin-top:2px;}
.subject-tabs{display:flex;gap:6px;padding:0 20px 12px;max-width:980px;margin:0 auto;flex-wrap:wrap;}
.tab{font-family:'Sora',sans-serif;padding:5px 13px;border-radius:20px;font-size:.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all .2s;}
.tab-all.active{background:var(--text);color:#000;border-color:transparent;}
.tab-physics.active{background:var(--accent2);color:#fff;border-color:transparent;}
.tab-chemistry.active{background:var(--green);color:#fff;border-color:transparent;}
.tab-maths.active{background:var(--accent);color:#000;border-color:transparent;}
.filters{display:flex;gap:7px;padding:0 20px 14px;max-width:980px;margin:0 auto;flex-wrap:wrap;align-items:center;}
select{font-family:'Sora',sans-serif;border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 11px;border-radius:8px;font-size:.8rem;cursor:pointer;outline:none;transition:all .2s;}
select:hover{border-color:var(--accent2);}
.btn-primary{font-family:'Sora',sans-serif;background:var(--accent);color:#000;font-weight:700;border:none;padding:7px 16px;border-radius:8px;font-size:.8rem;cursor:pointer;transition:all .2s;}
.btn-primary:hover{background:#fbbf24;transform:translateY(-1px);}
.q-count-badge{font-size:.7rem;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:4px 10px;border-radius:7px;font-family:'JetBrains Mono',monospace;}
.main{max-width:980px;margin:0 auto;padding:0 20px 60px;}
.lang-notice{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:9px;padding:9px 14px;margin-bottom:12px;font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:7px;}
.lang-notice.hidden{display:none;}
.progress-bar{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 15px;margin-bottom:12px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
.progress-track{flex:1;min-width:60px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:3px;transition:width .4s;}
.progress-text{font-size:.7rem;color:var(--muted);white-space:nowrap;font-family:'JetBrains Mono',monospace;}
.score-display{display:flex;gap:11px;}.score-item{display:flex;align-items:center;gap:4px;font-size:.7rem;}
.dot{width:6px;height:6px;border-radius:50%;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:12px;animation:fadeUp .3s ease;position:relative;overflow:hidden;}
.q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent2),var(--accent));}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-meta{display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap;}
.tag{font-size:.62rem;font-weight:600;padding:2px 7px;border-radius:5px;letter-spacing:.3px;font-family:'Sora',sans-serif!important;}
.tag-physics{background:rgba(59,130,246,.15);color:var(--accent2);border:1px solid rgba(59,130,246,.25);}
.tag-chemistry{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.25);}
.tag-maths{background:rgba(245,158,11,.15);color:var(--accent);border:1px solid rgba(245,158,11,.25);}
.tag-year{background:rgba(148,163,184,.1);color:var(--muted);border:1px solid rgba(148,163,184,.15);}
.tag-chapter{background:rgba(168,85,247,.12);color:#a78bfa;border:1px solid rgba(168,85,247,.2);}
.q-number{font-size:.68rem;color:var(--muted);margin-bottom:5px;font-family:'JetBrains Mono',monospace;}
.q-text{font-size:.93rem;line-height:1.8;color:var(--text);margin-bottom:15px;}
.options{display:grid;gap:7px;}
.option{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all .2s;font-size:.84rem;line-height:1.5;}
.option:hover{border-color:var(--accent2);background:rgba(59,130,246,.07);}
.option.revealed-correct,.option.correct{border-color:var(--green);background:rgba(16,185,129,.1);}
.option.wrong{border-color:var(--red);background:rgba(239,68,68,.08);}
.opt-letter{width:23px;height:23px;border-radius:5px;background:var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;flex-shrink:0;font-family:'Sora',sans-serif!important;}
.correct .opt-letter,.revealed-correct .opt-letter{background:var(--green);color:#fff;}
.wrong .opt-letter{background:var(--red);color:#fff;}
.q-actions{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap;}
.btn-sm{font-family:'Sora',sans-serif;padding:6px 11px;border-radius:7px;font-size:.73rem;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all .2s;display:flex;align-items:center;gap:4px;}
.btn-sm:hover{border-color:var(--accent);color:var(--accent);}
.btn-ai{background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(249,115,22,.12));border-color:rgba(245,158,11,.35);color:var(--accent);}
.btn-ai:hover{background:linear-gradient(135deg,rgba(245,158,11,.22),rgba(249,115,22,.22));}
.ai-box{margin-top:12px;background:linear-gradient(135deg,rgba(245,158,11,.04),rgba(59,130,246,.04));border:1px solid rgba(245,158,11,.18);border-radius:10px;padding:14px;display:none;}
.ai-box.active{display:block;animation:fadeUp .3s ease;}
.ai-header{display:flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;color:var(--accent);margin-bottom:8px;letter-spacing:.4px;font-family:'Sora',sans-serif!important;}
.ai-content{font-size:.82rem;line-height:1.9;color:#cbd5e1;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;}
body.lang-bn .ai-content,body.lang-hi .ai-content{font-family:'Noto Sans Bengali','Noto Sans Devanagari',sans-serif;font-size:.86rem;}
.typing-cursor{display:inline-block;width:2px;height:12px;background:var(--accent);animation:blink .8s infinite;vertical-align:middle;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.loading-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:0 2px;animation:bounce 1.2s infinite;}
.loading-dots span:nth-child(2){animation-delay:.2s}.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
.nav-btns{display:flex;gap:9px;justify-content:center;margin-top:4px;align-items:center;}
.btn-nav{font-family:'Sora',sans-serif;padding:7px 19px;border-radius:8px;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-prev{background:var(--surface);border:1px solid var(--border);color:var(--muted);}
.btn-prev:hover{border-color:var(--accent2);color:var(--text);}
.btn-next{background:var(--accent2);border:none;color:#fff;}
.btn-next:hover{background:#2563eb;transform:translateY(-1px);}
.q-jump{font-family:'JetBrains Mono',monospace;background:var(--card);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:7px;font-size:.76rem;width:50px;text-align:center;outline:none;}
.empty{text-align:center;padding:60px 24px;color:var(--muted);}
.empty-icon{font-size:3rem;margin-bottom:12px;}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">📚</div>
    <div class="logo-text">WB JEE <span>PYQ</span></div>
  </div>
  <div class="header-right">
    <div class="lang-switcher" title="Change language / ভাষা পরিবর্তন / भाषा बदलें">
      <button class="lang-btn active" onclick="setLang('en',this)">EN</button>
      <button class="lang-btn" onclick="setLang('bn',this)">বাং</button>
      <button class="lang-btn" onclick="setLang('hi',this)">हिं</button>
    </div>
    <button class="back-btn" onclick="window.location.href='index.html'">← <span data-t="home">Home</span></button>
    <div class="badge">✦ AI • 90 Qs</div>
  </div>
</header>

<div class="hero">
  <h1><span data-t="heroTitle">Crack WB JEE with</span> <span class="accent" data-t="heroAI">AI Explanations</span></h1>
  <p data-t="heroSub">90 Previous Year Questions • Physics • Chemistry • Mathematics • 2015–2024</p>
</div>

<div class="stats">
  <div class="stat"><div class="stat-num">90</div><div class="stat-label" data-t="statQ">Questions</div></div>
  <div class="stat"><div class="stat-num">10</div><div class="stat-label" data-t="statYrs">Years</div></div>
  <div class="stat"><div class="stat-num">3</div><div class="stat-label" data-t="statSub">Subjects</div></div>
  <div class="stat"><div class="stat-num">AI</div><div class="stat-label" data-t="statAI">Powered</div></div>
</div>

<div class="subject-tabs">
  <button class="tab tab-all active" onclick="setTab('all',this)" data-t="tabAll">All (90)</button>
  <button class="tab tab-physics" onclick="setTab('Physics',this)">⚡ Physics</button>
  <button class="tab tab-chemistry" onclick="setTab('Chemistry',this)">🧪 Chemistry</button>
  <button class="tab tab-maths" onclick="setTab('Mathematics',this)">📐 Maths</button>
</div>

<div class="filters">
  <select id="yearFilter">
    <option value="all" data-t="filterAllYears">All Years</option>
    <option value="2024">2024</option><option value="2023">2023</option><option value="2022">2022</option>
    <option value="2021">2021</option><option value="2020">2020</option><option value="2019">2019</option>
    <option value="2018">2018</option><option value="2017">2017</option><option value="2016">2016</option><option value="2015">2015</option>
  </select>
  <select id="diffFilter">
    <option value="all" data-t="filterAllDiff">All Difficulty</option>
    <option value="Easy" data-t="easy">Easy</option>
    <option value="Medium" data-t="medium">Medium</option>
    <option value="Hard" data-t="hard">Hard</option>
  </select>
  <button class="btn-primary" onclick="applyFilters()">🔍 <span data-t="filter">Filter</span></button>
  <div class="q-count-badge" id="qCountBadge">90 questions</div>
</div>

<div class="main">
  <div class="lang-notice hidden" id="langNotice">
    🌐 <span id="langNoticeText"></span>
  </div>
  <div class="progress-bar">
    <div style="font-size:.7rem;color:var(--muted);white-space:nowrap" data-t="progress">Progress</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">0 / 90</div>
    <div class="score-display">
      <div class="score-item"><div class="dot" style="background:var(--green)"></div><span id="correctCount">0</span> <span data-t="correct">Correct</span></div>
      <div class="score-item"><div class="dot" style="background:var(--red)"></div><span id="wrongCount">0</span> <span data-t="wrong">Wrong</span></div>
    </div>
  </div>
  <div id="questionArea"></div>
  <div class="nav-btns" id="navBtns">
    <button class="btn-nav btn-prev" onclick="navigate(-1)">← <span data-t="prev">Prev</span></button>
    <input class="q-jump" id="jumpInput" type="number" min="1" placeholder="Q#" onchange="jumpTo(this.value)"/>
    <button class="btn-nav btn-next" onclick="navigate(1)"><span data-t="next">Next</span> →</button>
  </div>
</div>

<script>
// ── TRANSLATIONS ──
const T={
  en:{home:"Home",heroTitle:"Crack WB JEE with",heroAI:"AI Explanations",heroSub:"90 Previous Year Questions • Physics • Chemistry • Mathematics • 2015–2024",statQ:"Questions",statYrs:"Years",statSub:"Subjects",statAI:"Powered",tabAll:"All (90)",filterAllYears:"All Years",filterAllDiff:"All Difficulty",easy:"Easy",medium:"Medium",hard:"Hard",filter:"Filter",progress:"Progress",correct:"Correct",wrong:"Wrong",prev:"Prev",next:"Next",revealAns:"Reveal Answer",showAns:"Show Answer",aiBtn:"🤖 AI Explanation",aiHeader:"🤖 AI EXPLANATION",aiPowered:"• Claude",loading:"Generating explanation...",noQ:"No questions found.\nTry different filters.",langNotice:"AI explanations in English.",qOf:"Question {c} of {t}",diffEasy:"Easy",diffMedium:"Medium",diffHard:"Hard"},
  bn:{home:"হোম",heroTitle:"WB JEE জয় করুন",heroAI:"AI ব্যাখ্যা দিয়ে",heroSub:"৯০টি বিগত বছরের প্রশ্ন • পদার্থবিজ্ঞান • রসায়ন • গণিত • ২০১৫–২০২৪",statQ:"প্রশ্ন",statYrs:"বছর",statSub:"বিষয়",statAI:"AI চালিত",tabAll:"সব (৯০)",filterAllYears:"সব বছর",filterAllDiff:"সব কঠিনতা",easy:"সহজ",medium:"মাঝারি",hard:"কঠিন",filter:"ফিল্টার",progress:"অগ্রগতি",correct:"সঠিক",wrong:"ভুল",prev:"আগে",next:"পরে",revealAns:"উত্তর দেখুন",showAns:"উত্তর দেখুন",aiBtn:"🤖 AI ব্যাখ্যা",aiHeader:"🤖 AI ব্যাখ্যা",aiPowered:"• Claude",loading:"বাংলায় ব্যাখ্যা তৈরি হচ্ছে...",noQ:"কোনো প্রশ্ন পাওয়া যায়নি।\nঅন্য ফিল্টার চেষ্টা করুন।",langNotice:"AI ব্যাখ্যা বাংলায় তৈরি হবে।",qOf:"প্রশ্ন {c} / {t}",diffEasy:"সহজ",diffMedium:"মাঝারি",diffHard:"কঠিন"},
  hi:{home:"होम",heroTitle:"WB JEE क्रैक करें",heroAI:"AI व्याख्या से",heroSub:"90 पिछले वर्षों के प्रश्न • भौतिकी • रसायन • गणित • 2015–2024",statQ:"प्रश्न",statYrs:"वर्ष",statSub:"विषय",statAI:"AI संचालित",tabAll:"सभी (90)",filterAllYears:"सभी वर्ष",filterAllDiff:"सभी कठिनाई",easy:"आसान",medium:"मध्यम",hard:"कठिन",filter:"फ़िल्टर",progress:"प्रगति",correct:"सही",wrong:"गलत",prev:"पिछला",next:"अगला",revealAns:"उत्तर देखें",showAns:"उत्तर देखें",aiBtn:"🤖 AI व्याख्या",aiHeader:"🤖 AI व्याख्या",aiPowered:"• Claude",loading:"हिन्दी में व्याख्या तैयार हो रही है...",noQ:"कोई प्रश्न नहीं मिला।\nदूसरे फ़िल्टर आज़माएं।",langNotice:"AI व्याख्या हिन्दी में होगी।",qOf:"प्रश्न {c} / {t}",diffEasy:"आसान",diffMedium:"मध्यम",diffHard:"कठिन"}
};
let currentLang='en';
function t(k){return T[currentLang][k]||T.en[k]||k;}
function setLang(lang,el){
  currentLang=lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.body.className=lang!=='en'?'lang-'+lang:'';
  document.querySelectorAll('[data-t]').forEach(el=>{const k=el.getAttribute('data-t');const v=T[lang][k]||T.en[k];if(v)el.textContent=v;});
  const notice=document.getElementById('langNotice');
  if(lang!=='en'){notice.classList.remove('hidden');document.getElementById('langNoticeText').textContent=T[lang].langNotice||'';}
  else notice.classList.add('hidden');
  if(filtered.length) renderQuestion();
}

// ── QUESTIONS ──
const ALL_QUESTIONS=[
{id:1,year:2024,subject:"Physics",chapter:"Kinematics",difficulty:"Medium",text:"A particle moves along x-axis with position x = 6t² − 2t³. The particle comes to rest at time t =",options:["t = 0 only","t = 2 s only","t = 0 and t = 2 s","t = 1 s only"],answer:2,explanation:{en:"v = dx/dt = 12t − 6t²\nSet v = 0: 6t(2−t) = 0 → t = 0 or t = 2 s\n\n✅ Answer: t = 0 and t = 2 s\n💡 Differentiate position to get velocity, set to zero.",bn:"v = dx/dt = 12t − 6t²\nv = 0 রাখলে: 6t(2−t) = 0 → t = 0 বা t = 2 s\n\n✅ উত্তর: t = 0 এবং t = 2 s\n💡 অবস্থানের অবকলন করলে বেগ পাওয়া যায়।",hi:"v = dx/dt = 12t − 6t²\nv = 0 रखने पर: 6t(2−t) = 0 → t = 0 या t = 2 s\n\n✅ उत्तर: t = 0 और t = 2 s\n💡 स्थिति का अवकलन = वेग।"}},
{id:2,year:2024,subject:"Physics",chapter:"Laws of Motion",difficulty:"Easy",text:"A block of mass 5 kg is on a rough surface with μ = 0.4. Minimum force to move it? (g = 10 m/s²)",options:["10 N","20 N","25 N","40 N"],answer:1,explanation:{en:"N = mg = 50 N\nLimiting friction = μN = 20 N\n\n✅ Answer: 20 N",bn:"N = mg = 50 N\nসীমান্ত ঘর্ষণ = μN = 20 N\n\n✅ উত্তর: 20 N",hi:"N = mg = 50 N\nसीमांत घर्षण = μN = 20 N\n\n✅ उत्तर: 20 N"}},
{id:3,year:2023,subject:"Physics",chapter:"Work & Energy",difficulty:"Medium",text:"Body of mass 2 kg thrown upward with KE = 490 J. Height reached? (g = 9.8 m/s²)",options:["50 m","25 m","20 m","10 m"],answer:1,explanation:{en:"KE = mgh → h = 490/(2×9.8) = 25 m\n\n✅ Answer: 25 m\n💡 Energy conservation: KE = PE at top.",bn:"KE = mgh → h = 25 m\n\n✅ উত্তর: 25 m",hi:"KE = mgh → h = 25 m\n\n✅ उत्तर: 25 m"}},

{id:46,year:2020,subject:"Chemistry",chapter:"p-Block Elements",difficulty:"Easy",text:"Which is most acidic?",options:["HClO₄","HClO₃","HClO₂","HClO"],answer:0,explanation:{en:"More O atoms → more acidic. HClO₄ is most acidic.\n\n✅ Answer: HClO₄",bn:"বেশি O → বেশি অম্লীয়। HClO₄ সবচেয়ে বেশি।\n\n✅ উত্তর: HClO₄",hi:"अधिक O → अधिक अम्लीय। HClO₄ सबसे अम्लीय।\n\n✅ उत्तर: HClO₄"}},
{id:47,year:2019,subject:"Chemistry",chapter:"Polymers",difficulty:"Easy",text:"Teflon is a polymer of:",options:["Tetrafluoroethylene","Ethylene","Propylene","Vinyl chloride"],answer:0,explanation:{en:"Teflon = PTFE, monomer = CF₂=CF₂\n\n✅ Answer: Tetrafluoroethylene",bn:"Teflon = PTFE, একক = CF₂=CF₂\n\n✅ উত্তর: Tetrafluoroethylene",hi:"Teflon = PTFE, एकलक = CF₂=CF₂\n\n✅ उत्तर: Tetrafluoroethylene"}},
{id:48,year:2018,subject:"Chemistry",chapter:"Biomolecules",difficulty:"Easy",text:"The monomer of proteins is:",options:["Amino acids","Glucose","Nucleotides","Fatty acids"],answer:0,explanation:{en:"Proteins = amino acids linked by peptide bonds.\n\n✅ Answer: Amino acids",bn:"প্রোটিন = অ্যামিনো অ্যাসিডের বহুলক\n\n✅ উত্তর: Amino acids",hi:"प्रोटीन = अमीनो अम्ल का बहुलक\n\n✅ उत्तर: Amino acids"}},
{id:49,year:2017,subject:"Chemistry",chapter:"Surface Chemistry",difficulty:"Medium",text:"Which is an example of emulsion?",options:["Milk","Smoke","Fog","Pumice"],answer:0,explanation:{en:"Emulsion = liquid in liquid. Milk = fat in water.\n\n✅ Answer: Milk",bn:"ইমালশন = তরলে তরল। দুধ = পানিতে চর্বি।\n\n✅ উত্তর: Milk",hi:"इमल्शन = द्रव में द्रव। दूध = जल में वसा।\n\n✅ उत्तर: Milk"}},
{id:50,year:2016,subject:"Chemistry",chapter:"Isomerism",difficulty:"Medium",text:"Which exhibits geometrical isomerism?",options:["2-butene","Propene","Ethylene","Acetylene"],answer:0,explanation:{en:"2-Butene has cis and trans forms.\n\n✅ Answer: 2-butene",bn:"2-বিউটিনে সিস-ট্রান্স সমাণু সম্ভব।\n\n✅ উত্তর: 2-butene",hi:"2-ब्यूटीन में सिस-ट्रांस संभव।\n\n✅ उत्तर: 2-butene"}},
{id:51,year:2015,subject:"Chemistry",chapter:"Haloalkanes",difficulty:"Medium",text:"SN2 reaction is favoured by:",options:["Primary alkyl halide","Tertiary alkyl halide","Secondary alkyl halide","Aryl halide"],answer:0,explanation:{en:"SN2 needs least steric hindrance → Primary.\n\n✅ Answer: Primary alkyl halide",bn:"SN2-এ ন্যূনতম বাধা → প্রাথমিক\n\n✅ উত্তর: Primary alkyl halide",hi:"SN2 में कम बाधा → प्राथमिक\n\n✅ उत्तर: Primary alkyl halide"}},
{id:52,year:2024,subject:"Chemistry",chapter:"d-Block Elements",difficulty:"Medium",text:"Which transition metal has the highest melting point?",options:["Tungsten (W)","Iron (Fe)","Copper (Cu)","Chromium (Cr)"],answer:0,explanation:{en:"Tungsten: 3422°C — highest of all metals.\n\n✅ Answer: Tungsten",bn:"টাংস্টেন: 3422°C — সর্বোচ্চ\n\n✅ উত্তর: Tungsten",hi:"टंगस्टन: 3422°C — सर्वाधिक\n\n✅ उत्तर: Tungsten"}},
{id:53,year:2023,subject:"Chemistry",chapter:"Aldehydes & Ketones",difficulty:"Medium",text:"Which test distinguishes aldehyde from ketone?",options:["Tollens' test","Iodoform test","Lucas test","Benedict's test"],answer:0,explanation:{en:"Tollens' test: silver mirror — positive for aldehyde only.\n\n✅ Answer: Tollens' test",bn:"টলেন্স পরীক্ষা: শুধু অ্যালডিহাইডে ধনাত্মক।\n\n✅ উত্তর: Tollens' test",hi:"टॉलेन परीक्षण: केवल एल्डिहाइड के लिए सकारात्मक।\n\n✅ उत्तर: Tollens' test"}},
{id:54,year:2022,subject:"Chemistry",chapter:"Carboxylic Acids",difficulty:"Easy",text:"Acetic acid + NaOH forms:",options:["Sodium acetate + water","Sodium acetate + H₂","Ethanol + NaCl","Ethyl acetate"],answer:0,explanation:{en:"CH₃COOH + NaOH → CH₃COONa + H₂O\n\n✅ Answer: Sodium acetate + water",bn:"CH₃COONa + H₂O\n\n✅ উত্তর: সোডিয়াম অ্যাসিটেট + জল",hi:"CH₃COONa + H₂O\n\n✅ उत्तर: सोडियम एसीटेट + जल"}},
{id:55,year:2021,subject:"Chemistry",chapter:"Amines",difficulty:"Medium",text:"Highest basic strength in aqueous solution:",options:["Methylamine","Ammonia","Dimethylamine","Trimethylamine"],answer:2,explanation:{en:"Dimethylamine > Methylamine > Trimethylamine > NH₃\n\n✅ Answer: Dimethylamine",bn:"Dimethylamine সবচেয়ে বেশি ক্ষারীয়\n\n✅ উত্তর: Dimethylamine",hi:"Dimethylamine सबसे अधिक क्षारीय\n\n✅ उत्तर: Dimethylamine"}},
{id:56,year:2020,subject:"Chemistry",chapter:"Solid State",difficulty:"Hard",text:"Atoms per unit cell in FCC:",options:["4","2","1","8"],answer:0,explanation:{en:"8×(1/8) + 6×(1/2) = 4\n\n✅ Answer: 4\n💡 BCC=2, SC=1",bn:"8×(1/8) + 6×(1/2) = 4\n\n✅ উত্তর: 4",hi:"8×(1/8) + 6×(1/2) = 4\n\n✅ उत्तर: 4"}},
{id:57,year:2019,subject:"Chemistry",chapter:"Chemical Kinetics",difficulty:"Medium",text:"For first-order reaction, half-life t½ =",options:["0.693/k","k/0.693","1/k","0.693k"],answer:0,explanation:{en:"t½ = 0.693/k (independent of concentration)\n\n✅ Answer: 0.693/k",bn:"t½ = 0.693/k (ঘনত্ব নিরপেক্ষ)\n\n✅ উত্তর: 0.693/k",hi:"t½ = 0.693/k (सांद्रता निरपेक्ष)\n\n✅ उत्तर: 0.693/k"}},
{id:58,year:2018,subject:"Chemistry",chapter:"Colligative Properties",difficulty:"Medium",text:"Elevation in boiling point depends on:",options:["Number of solute particles","Nature of solute","Nature of solvent","Size of solute"],answer:0,explanation:{en:"Colligative properties depend only on number of particles.\n\n✅ Answer: Number of solute particles",bn:"অবনমন ধর্ম শুধু কণার সংখ্যার উপর নির্ভরশীল।\n\n✅ উত্তর: দ্রাবক কণার সংখ্যা",hi:"अणुसंख्य गुण केवल कणों की संख्या पर।\n\n✅ उत्तर: विलेय कणों की संख्या"}},
{id:59,year:2017,subject:"Chemistry",chapter:"Metallurgy",difficulty:"Easy",text:"Heating ore in limited air to remove volatile impurities:",options:["Calcination","Roasting","Smelting","Refining"],answer:0,explanation:{en:"Calcination: limited air → removes CO₂, H₂O.\n\n✅ Answer: Calcination",bn:"ক্যালসিনেশন: সীমিত বায়ু → CO₂, H₂O সরে যায়।\n\n✅ উত্তর: Calcination",hi:"कैल्सिनेशन: सीमित वायु → CO₂, H₂O हटता है।\n\n✅ उत्तर: Calcination"}},
{id:60,year:2016,subject:"Chemistry",chapter:"Environmental Chemistry",difficulty:"Easy",text:"Main cause of acid rain:",options:["SO₂ and NO₂","CO₂","O₃","CH₄"],answer:0,explanation:{en:"SO₂ + H₂O → H₂SO₃; NOₓ → HNO₃\n\n✅ Answer: SO₂ and NO₂",bn:"SO₂ এবং NO₂ অ্যাসিড বৃষ্টির কারণ।\n\n✅ উত্তর: SO₂ and NO₂",hi:"SO₂ और NO₂ अम्ल वर्षा का कारण।\n\n✅ उत्तर: SO₂ and NO₂"}},

{id:64,year:2023,subject:"Mathematics",chapter:"Probability",difficulty:"Medium",text:"A die is thrown. P(prime number) =",options:["1/2","1/3","2/3","1/6"],answer:0,explanation:{en:"Primes: {2,3,5} = 3/6 = 1/2\n\n✅ Answer: 1/2\n💡 1 is NOT prime!",bn:"মৌলিক: {2,3,5} → P = 1/2\n\n✅ উত্তর: 1/2\n💡 1 মৌলিক নয়!",hi:"अभाज्य: {2,3,5} → P = 1/2\n\n✅ उत्तर: 1/2\n💡 1 अभाज्य नहीं!"}},
{id:65,year:2022,subject:"Mathematics",chapter:"Differentiation",difficulty:"Medium",text:"y = x³ + 2x² − 5x + 1. dy/dx at x = 1:",options:["3","2","1","0"],answer:1,explanation:{en:"dy/dx = 3x²+4x−5; at x=1: 2\n\n✅ Answer: 2",bn:"dy/dx = 3x²+4x−5; x=1 এ: 2\n\n✅ উত্তর: 2",hi:"dy/dx = 3x²+4x−5; x=1 पर: 2\n\n✅ उत्तर: 2"}},

// ── APP LOGIC ──
let filtered=[...ALL_QUESTIONS],current=0,answered={},activeTab='all';

function setTab(s,el){activeTab=s;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');applyFilters();}

function applyFilters(){
  const yr=document.getElementById('yearFilter').value,diff=document.getElementById('diffFilter').value;
  filtered=ALL_QUESTIONS.filter(q=>(activeTab==='all'||q.subject===activeTab)&&(yr==='all'||q.year==yr)&&(diff==='all'||q.difficulty===diff));
  current=0;
  document.getElementById('qCountBadge').textContent=filtered.length+' '+t('statQ').toLowerCase();
  if(!filtered.length){document.getElementById('questionArea').innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><p>${t('noQ')}</p></div>`;document.getElementById('navBtns').style.display='none';updateProgress();return;}
  document.getElementById('navBtns').style.display='flex';renderQuestion();
}

function getExpl(q){return q.explanation[currentLang]||q.explanation.en||'';}

function renderQuestion(){
  const q=filtered[current];if(!q)return;
  updateProgress();
  const ans=answered[q.id];
  const sc=q.subject==='Physics'?'tag-physics':q.subject==='Chemistry'?'tag-chemistry':'tag-maths';
  const si=q.subject==='Physics'?'⚡':q.subject==='Chemistry'?'🧪':'📐';
  const dc=q.difficulty==='Easy'?'#10b981':q.difficulty==='Medium'?'#f59e0b':'#ef4444';
  const dl=q.difficulty==='Easy'?t('diffEasy'):q.difficulty==='Medium'?t('diffMedium'):t('diffHard');
  const opts=q.options.map((o,i)=>{let c='';if(ans!==undefined){if(i===q.answer)c='revealed-correct';if(i===ans&&ans!==q.answer)c='wrong';}return`<div class="option ${c}" onclick="selectAnswer(${i})"><div class="opt-letter">${String.fromCharCode(65+i)}</div><span>${o}</span></div>`;}).join('');
  const ql=t('qOf').replace('{c}',current+1).replace('{t}',filtered.length);
  const aiShown=answered[q.id+'_ai'];
  const cachedExp=answered[q.id+'_exp_'+currentLang];
  document.getElementById('questionArea').innerHTML=`<div class="q-card"><div class="q-meta"><span class="tag ${sc}">${si} ${q.subject}</span><span class="tag tag-year">📅 WB JEE ${q.year}</span><span class="tag tag-chapter">📖 ${q.chapter}</span><span class="tag" style="background:${dc}22;color:${dc};border:1px solid ${dc}44">${dl}</span></div><div class="q-number">${ql}</div><div class="q-text">${q.text}</div><div class="options">${opts}</div><div class="q-actions">${ans!==undefined?`<button class="btn-sm btn-ai" onclick="getAIExplanation()">${t('aiBtn')}</button>`:''}<button class="btn-sm" onclick="revealAnswer()">👁 ${ans!==undefined?t('showAns'):t('revealAns')}</button></div><div class="ai-box ${aiShown?'active':''}" id="aiBox"><div class="ai-header">${t('aiHeader')} <span style="opacity:.5;font-weight:400">${t('aiPowered')}</span></div><div class="ai-content" id="aiContent">${aiShown?(cachedExp||getExpl(q)):''}</div></div></div>`;
  document.getElementById('jumpInput').value=current+1;
}

function selectAnswer(i){const q=filtered[current];if(answered[q.id]!==undefined)return;answered[q.id]=i;renderQuestion();updateProgress();}
function revealAnswer(){const q=filtered[current];if(answered[q.id]===undefined)answered[q.id]=q.answer;renderQuestion();}

function updateProgress(){
  const total=filtered.length,done=filtered.filter(q=>answered[q.id]!==undefined).length,correct=filtered.filter(q=>answered[q.id]===q.answer).length;
  document.getElementById('progressFill').style.width=total?(done/total*100)+'%':'0%';
  document.getElementById('progressText').textContent=`${done} / ${total}`;
  document.getElementById('correctCount').textContent=correct;
  document.getElementById('wrongCount').textContent=done-correct;
}

async function getAIExplanation(){
  const q=filtered[current];
  document.getElementById('aiBox').classList.add('active');
  document.getElementById('aiContent').innerHTML=`<div class="loading-dots"><span></span><span></span><span></span></div> ${t('loading')}`;
  const cacheKey=q.id+'_exp_'+currentLang;
  if(answered[cacheKey]){typeText(answered[cacheKey]);return;}
  const li=currentLang==='bn'?'Respond ENTIRELY in Bengali (বাংলা). Use Bengali script.':currentLang==='hi'?'Respond ENTIRELY in Hindi (हिन्दी). Use Devanagari script.':'Respond in English.';
  const prompt=`${li}\n\nYou are a WB JEE expert tutor. Give a clear step-by-step solution.\n\nSubject: ${q.subject} | Chapter: ${q.chapter} | Year: WB JEE ${q.year} | Difficulty: ${q.difficulty}\nQuestion: ${q.text}\nOptions: ${q.options.map((o,i)=>String.fromCharCode(65+i)+') '+o).join(' | ')}\nCorrect Answer: ${String.fromCharCode(65+q.answer)}) ${q.options[q.answer]}\n\nProvide 3-5 clear steps. End with one exam tip.`;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
    const data=await res.json();
    const text=data.content?.map(b=>b.text||'').join('')||getExpl(q);
    answered[q.id+'_ai']=true;answered[cacheKey]=text;typeText(text);
  }catch(e){answered[q.id+'_ai']=true;typeText(getExpl(q));}
}

function typeText(text){
  const c=document.getElementById('aiContent');c.innerHTML='';let i=0;
  const cur=document.createElement('span');cur.className='typing-cursor';
  function type(){if(i<text.length){c.textContent=text.slice(0,++i);c.appendChild(cur);setTimeout(type,8);}else cur.remove();}type();
}

function navigate(dir){current=Math.max(0,Math.min(filtered.length-1,current+dir));renderQuestion();}
function jumpTo(val){const n=parseInt(val)-1;if(!isNaN(n)&&n>=0&&n<filtered.length){current=n;renderQuestion();}}

applyFilters();
</script>
